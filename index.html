<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ddtokens Visual Playground</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <h1>ddtokens Playground</h1>
            </div>
            <div class="header-actions">
                <div class="dropdown-container">
                    <button id="compare-btn" class="btn">Compare ▼</button>
                    <div id="compare-dropdown" class="dropdown-menu hidden">
                        <div class="dropdown-item" data-value="none">None</div>
                        <div class="dropdown-item" data-value="llama-3">LLaMA 3</div>
                        <div class="dropdown-item" data-value="gpt-4">GPT-4 (cl100k_base)</div>
                        <div class="dropdown-item" data-value="gpt-3">GPT-3 (p50k_base)</div>
                        <div class="dropdown-item" data-value="bert">BERT (WordPiece)</div>
                    </div>
                </div>
                <button id="sample-btn" class="btn">Sample Text</button>
                <button id="clear-btn" class="btn">Clear</button>
            </div>
        </header>
        
        <main>
            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <p>Loading Vocabulary & Merges...</p>
            </div>
            
            <div class="workspace">
                <div class="panel input-panel">
                    <textarea id="text-input" placeholder="Type some text here to see how it's tokenized..."></textarea>
                </div>
                
                <div class="panel output-panel">
                    <div id="token-visualization" class="token-viz"></div>
                    <div class="resizer" id="resizer"></div>
                    <div class="token-list-container" id="token-list-container">
                        <h3>Token IDs</h3>
                        <div id="token-ids" class="token-ids-list"></div>
                    </div>
                </div>
            </div>
            
            <div class="stats-bar">
                <div class="stat">
                    <span class="stat-label">Characters</span>
                    <span class="stat-value" id="char-count">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Tokens</span>
                    <span class="stat-value" id="token-count">0</span>
                </div>
            </div>

            <div id="comparison-container" class="hidden">
                <div class="panel comparison-panel" style="margin-top: 1.5rem;">
                    <div class="comparison-header">
                        <h3 id="compare-title">Comparing with</h3>
                        <div class="stat">
                            <span class="stat-label">Compare Tokens</span>
                            <span class="stat-value" id="compare-token-count">0</span>
                        </div>
                    </div>
                    <div id="compare-token-visualization" class="token-viz"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://belladoreai.github.io/llama3-tokenizer-js/bundle/llama3-tokenizer-with-baked-data.js"></script>
    <script src="tokenizer.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
